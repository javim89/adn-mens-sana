name: bioteam

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    image: bioteam-dev
    init: true
    environment:
      # Pisan a .env.local, que Next lee por el bind mount. No usar env_file: los secretos
      # quedarían en `docker inspect`.
      NEXT_PUBLIC_ROOT_DOMAIN: bioteam.local
      NEXT_PUBLIC_APP_URL: https://bioteam.local
    labels:
      dev.orbstack.domains: bioteam.local,*.bioteam.local
      dev.orbstack.http-port: "3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3000"]
      interval: 5s
      timeout: 3s
      retries: 3
      # El primer arranque corre pnpm install.
      start_period: 300s

  tools:
    profiles: [tools]
    image: bioteam-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    init: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # Separado de next_cache: `next build` no pisa el .next del dev server.
      - next_build:/app/.next

  e2e:
    profiles: [e2e]
    image: bioteam-e2e
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: e2e
    init: true
    ipc: host
    environment:
      NEXT_PUBLIC_ROOT_DOMAIN: ""
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_e2e:/app/.next

volumes:
  node_modules:
  next_cache:
  next_build:
  next_e2e:
